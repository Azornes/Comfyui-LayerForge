# Reusable workflow
#
# Project metadata is read from pyproject.toml and the Comfy Registry API.
# No project-specific repository variables need to be configured manually.
# The workflow creates and maintains this internal repository variable automatically:
#   COMFY_DOWNLOADS_GIST_ID
#
# Required repository secret:
#   SECRET_TOKEN   Fine-grained personal access token with access to this repository:
#                  Repository permissions:
#                    Variables: Read and write
#                  Account permissions:
#                    Gists: Read and write

name: ComfyUI Top Downloads Badge

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: badge-updates-${{ github.repository }}
  cancel-in-progress: false

env:
  COMFY_DOWNLOADS_GIST_ID: ${{ vars.COMFY_DOWNLOADS_GIST_ID }}
  BADGE_DOC: badges/DOWNLOADS.md
  DATA_FILE: comfyui_downloads.json

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Read project metadata and validate authentication
        id: project
        env:
          GH_TOKEN: ${{ secrets.SECRET_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error title=Missing SECRET_TOKEN::Add a fine-grained PAT with Variables: Read and write and Gists: Read and write."
            exit 1
          fi

          gh auth status

          python - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          import tomllib

          path = Path("pyproject.toml")
          if not path.is_file():
              raise SystemExit("pyproject.toml was not found")

          with path.open("rb") as file:
              config = tomllib.load(file)

          node_id = str(config.get("project", {}).get("name", "")).strip()
          if not node_id:
              raise SystemExit("[project].name is missing in pyproject.toml")

          print(f"node_id={node_id}")
          PY

      - name: Query Comfy Registry API and find top download
        env:
          COMFY_NODE_ID: ${{ steps.project.outputs.node_id }}
        run: |
          max_downloads=0
          found_valid_data=false
          top_node_json="{}"

          for i in {1..3}; do
            echo "Fetching data for attempt $i..."
            response_file="registry_response_$i.json"

            if ! curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors \
              -H "Accept: application/json" \
              "https://api.comfy.org/nodes/${COMFY_NODE_ID}" > "$response_file"; then
              echo "Error: request failed for attempt $i"
              rm -f "$response_file"
              continue
            fi

            if [ ! -s "$response_file" ] || ! jq empty "$response_file" 2>/dev/null; then
              echo "Error: invalid JSON for attempt $i"
              rm -f "$response_file"
              continue
            fi

            if jq -e 'type == "array"' "$response_file" >/dev/null; then
              node_count=$(jq 'length' "$response_file")
              echo "Found $node_count nodes in attempt $i"

              while IFS= read -r node_json; do
                downloads=$(jq -r '.downloads // 0' <<< "$node_json")
                name=$(jq -r '.name // ""' <<< "$node_json")

                if ! [[ "$downloads" =~ ^[0-9]+$ ]]; then
                  downloads=0
                fi

                if [ "$found_valid_data" = false ] || [ "$downloads" -gt "$max_downloads" ]; then
                  found_valid_data=true
                  max_downloads=$downloads
                  top_node_json=$node_json
                  echo "New maximum found: $downloads (node: $name)"
                fi
              done < <(jq -c '.[]' "$response_file")
            else
              downloads=$(jq -r '.downloads // 0' "$response_file")
              name=$(jq -r '.name // ""' "$response_file")

              if ! [[ "$downloads" =~ ^[0-9]+$ ]]; then
                downloads=0
              fi

              if [ "$found_valid_data" = false ] || [ "$downloads" -gt "$max_downloads" ]; then
                found_valid_data=true
                max_downloads=$downloads
                top_node_json=$(jq -c . "$response_file")
                echo "New maximum found: $downloads (node: $name)"
              fi
            fi

            rm -f "$response_file"
          done

          if [ "$found_valid_data" = false ]; then
            echo "Error: no valid data found"
            exit 1
          fi

          jq . <<< "$top_node_json" > "$DATA_FILE"
          echo "Highest download count: $max_downloads"
          jq . "$DATA_FILE"

          display_name=$(jq -r '.name // .id // empty' "$DATA_FILE")
          publisher_id=$(jq -r '.publisher.id // empty' "$DATA_FILE")
          node_slug=$(jq -r '(.id // empty) | ascii_downcase' "$DATA_FILE")

          if [ -z "$display_name" ] || [ -z "$publisher_id" ] || [ -z "$node_slug" ]; then
            echo "::error title=Incomplete Registry response::The node name, publisher ID, or node ID is missing."
            exit 1
          fi

          {
            echo "COMFY_NODE_DISPLAY_NAME=$display_name"
            echo "COMFY_PUBLISHER_ID=$publisher_id"
            echo "COMFY_NODE_SLUG=$node_slug"
          } >> "$GITHUB_ENV"

      - name: Create or reuse downloads Gist
        id: gist
        env:
          GH_TOKEN: ${{ secrets.SECRET_TOKEN }}
        run: |
          gist_id="$COMFY_DOWNLOADS_GIST_ID"
          expected_description="${GITHUB_REPOSITORY} ComfyUI download statistics"
          authenticated_user=$(gh api user --jq '.login')
          save_gist_id=false
          valid_gist=false

          if [ -z "$gist_id" ]; then
            gist_id=$(python - <<'PY'
          from pathlib import Path
          import os
          import re

          pattern = re.compile(
              r"query=downloads.*?url=https://gist\.githubusercontent\.com/[^/]+/([0-9a-f]+)",
              re.IGNORECASE,
          )

          for filename in (os.environ["BADGE_DOC"], "README.md"):
              path = Path(filename)
              if not path.is_file():
                  continue
              match = pattern.search(path.read_text(encoding="utf-8"))
              if match:
                  print(match.group(1))
                  break
          PY
            )

            if [ -n "$gist_id" ]; then
              echo "Found an existing downloads Gist in the badge documentation: $gist_id"
              save_gist_id=true
            fi
          fi

          if [ -n "$gist_id" ] && gh gist view "$gist_id" >/dev/null 2>&1; then
            gist_filename=$(gh api "gists/$gist_id" --jq '
              .files
              | keys
              | if index("comfyui_downloads.json") then
                  "comfyui_downloads.json"
                else
                  (map(select(endswith(".json"))) | first // "comfyui_downloads.json")
                end
            ')
            gist_owner=$(gh api "gists/$gist_id" --jq '.owner.login')
            gist_description=$(gh api "gists/$gist_id" --jq '.description // ""')
            gist_node_slug=$(
              gh api "gists/$gist_id" |
                jq -r --arg filename "$gist_filename" '
                  .files[$filename].content // ""
                  | fromjson?
                  | ((.id // empty) | ascii_downcase)
                '
            )

            if [ "$gist_owner" = "$authenticated_user" ] &&
              { [ "$gist_description" = "$expected_description" ] ||
                [ "$gist_node_slug" = "$COMFY_NODE_SLUG" ]; }; then
              valid_gist=true
            else
              echo "The detected Gist belongs to another repository, token owner, or ComfyUI node."
            fi
          fi

          if [ "$valid_gist" = true ]; then
            echo "Using existing Gist: $gist_id"
          else
            if [ -n "$gist_id" ]; then
              echo "Configured Gist does not exist or is inaccessible; creating a new one."
            else
              echo "No Gist is configured; creating one."
            fi

            gist_url=$(gh gist create "$DATA_FILE" \
              --desc "$expected_description")
            gist_id="${gist_url##*/}"
            save_gist_id=true
          fi

          if [ "$save_gist_id" = true ]; then
            if ! gh variable set COMFY_DOWNLOADS_GIST_ID --body "$gist_id"; then
              echo "::error title=Cannot save Gist ID::Grant SECRET_TOKEN repository Actions variables write access."
              exit 1
            fi

            echo "Saved COMFY_DOWNLOADS_GIST_ID=$gist_id"
          fi

          gist_filename=$(gh api "gists/$gist_id" --jq '
            .files
            | keys
            | if index("comfyui_downloads.json") then
                "comfyui_downloads.json"
              else
                (map(select(endswith(".json"))) | first // "comfyui_downloads.json")
              end
          ')
          gist_owner=$(gh api "gists/$gist_id" --jq '.owner.login')
          echo "id=$gist_id" >> "$GITHUB_OUTPUT"
          echo "filename=$gist_filename" >> "$GITHUB_OUTPUT"
          echo "owner=$gist_owner" >> "$GITHUB_OUTPUT"

      - name: Create or update badge document
        id: badge
        env:
          GIST_ID: ${{ steps.gist.outputs.id }}
          GIST_FILENAME: ${{ steps.gist.outputs.filename }}
          GIST_OWNER: ${{ steps.gist.outputs.owner }}
        run: |
          mkdir -p "$(dirname "$BADGE_DOC")"

          badge_label=$(jq -rn --arg value "$COMFY_NODE_DISPLAY_NAME" '$value | @uri')
          registry_url="https://registry.comfy.org/publishers/${COMFY_PUBLISHER_ID}/nodes/${COMFY_NODE_SLUG}"
          gist_url="https://gist.githubusercontent.com/${GIST_OWNER}/${GIST_ID}/raw/${GIST_FILENAME}"
          shields="https://img.shields.io/badge/dynamic/json?color=informational&label=${badge_label}&query=downloads&url="
          shields_for_the_badge="https://img.shields.io/badge/dynamic/json?color=2F80ED&label=${badge_label}&query=downloads&url="
          comfy_badge="https://img.shields.io/badge/ComfyUI-1a1a1a?style=for-the-badge&logo=data:image/png;base64,"
          combined_downloads="https://img.shields.io/badge/dynamic/json?color=%230D2A4A&label=&query=downloads&url="

          {
            echo "**Markdown**"
            echo
            echo '```markdown'
            echo "[![${COMFY_NODE_DISPLAY_NAME}](${shields}${gist_url})](${registry_url})"
            echo '```'
            echo
            echo "[![${COMFY_NODE_DISPLAY_NAME}](${shields}${gist_url})](${registry_url})"
            echo
            echo "**HTML**"
            echo
            echo '```html'
            echo "<a href='${registry_url}'><img alt='${COMFY_NODE_DISPLAY_NAME}' src='${shields}${gist_url}'></a>"
            echo '```'
            echo
            echo "<a href='${registry_url}'><img alt='${COMFY_NODE_DISPLAY_NAME}' src='${shields}${gist_url}'></a>"
            echo
            echo "**HTML (for-the-badge)**"
            echo
            echo '```html'
            echo "<a href='${registry_url}'><img alt='${COMFY_NODE_DISPLAY_NAME}' src='${shields_for_the_badge}${gist_url}&style=for-the-badge'></a>"
            echo '```'
            echo
            echo "<a href='${registry_url}'><img alt='${COMFY_NODE_DISPLAY_NAME}' src='${shields_for_the_badge}${gist_url}&style=for-the-badge'></a>"
            echo
            echo "**Combined Markdown (for-the-badge)**"
            echo
            echo '```markdown'
            echo "[![ComfyUI](${comfy_badge})![Downloads](${combined_downloads}${gist_url}&style=for-the-badge)](${registry_url})"
            echo '```'
            echo
            echo "[![ComfyUI](${comfy_badge})![Downloads](${combined_downloads}${gist_url}&style=for-the-badge)](${registry_url})"
            echo
            echo "**Combined HTML (for-the-badge)**"
            echo
            echo '```html'
            echo "<a href='${registry_url}'><img alt='ComfyUI' src='${comfy_badge}'><img alt='Downloads' src='${combined_downloads}${gist_url}&style=for-the-badge'></a>"
            echo '```'
            echo
            echo "<a href='${registry_url}'><img alt='ComfyUI' src='${comfy_badge}'><img alt='Downloads' src='${combined_downloads}${gist_url}&style=for-the-badge'></a>"
          } > "$BADGE_DOC"

          if [ -n "$(git status --porcelain -- "$BADGE_DOC")" ]; then
            git add "$BADGE_DOC"
            git config user.name "GitHub Action"
            git config user.email "action@github.com"
            git commit -m "Create or update ComfyUI downloads badge"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Badge document is already up to date."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update Gist
        env:
          GH_TOKEN: ${{ secrets.SECRET_TOKEN }}
          GIST_ID: ${{ steps.gist.outputs.id }}
          GIST_FILENAME: ${{ steps.gist.outputs.filename }}
        run: |
          if ! jq empty "$DATA_FILE" 2>/dev/null; then
            echo "Error: invalid JSON in $DATA_FILE"
            exit 1
          fi

          content=$(jq -c . "$DATA_FILE")
          jq -n \
            --arg description "${GITHUB_REPOSITORY} ComfyUI download statistics" \
            --arg filename "$GIST_FILENAME" \
            --arg content "$content" \
            '{
              description: $description,
              files: {
                ($filename): {
                  content: $content
                }
              }
            }' > gist_patch.json

          gh api --method PATCH "gists/${GIST_ID}" --input gist_patch.json >/dev/null

      - name: Push badge document
        if: steps.badge.outputs.changed == 'true'
        run: git push
